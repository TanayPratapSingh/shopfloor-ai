version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports: ["2181:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    ports: ["5000:5000"]
    volumes:
      - ./data/models:/mlflow/artifacts
      - mlflow-db:/mlflow/db
    command: >
      mlflow server --backend-store-uri sqlite:///mlflow/db/mlflow.db
      --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000

  chromadb:
    image: chromadb/chroma:0.5.0
    ports: ["8000:8000"]
    volumes: ["./data/vectordb:/chroma/chroma"]

  airflow-init:
    image: apache/airflow:2.9.3-python3.11
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@shopfloor.dev || true"

  airflow-webserver:
    image: apache/airflow:2.9.3-python3.11
    depends_on: [airflow-init]
    ports: ["8080:8080"]
    volumes: ["./src/airflow/dags:/opt/airflow/dags", "./data:/opt/airflow/data", "./src:/opt/airflow/src"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "kafka-python-ng mlflow scikit-learn pandas chromadb langchain langchain-openai langchain-community"
    command: airflow webserver

  airflow-scheduler:
    image: apache/airflow:2.9.3-python3.11
    depends_on: [airflow-init]
    volumes: ["./src/airflow/dags:/opt/airflow/dags", "./data:/opt/airflow/data", "./src:/opt/airflow/src"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "kafka-python-ng mlflow scikit-learn pandas chromadb langchain langchain-openai langchain-community"
    command: airflow scheduler

  api:
    build: { context: ., dockerfile: Dockerfile }
    ports: ["8001:8001"]
    volumes: ["./src:/app/src", "./data:/app/data", "./configs:/app/configs"]
    depends_on: [kafka, mlflow, chromadb]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MLFLOW_TRACKING_URI: http://mlflow:5000
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8001 --reload

  dashboard:
    build: { context: ., dockerfile: Dockerfile }
    ports: ["8501:8501"]
    volumes: ["./src:/app/src", "./data:/app/data", "./configs:/app/configs"]
    depends_on: [api]
    environment:
      API_URL: http://api:8001
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  mlflow-db:
